[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riemann"
version = "0.1.0"
description = "Riemann Hypothesis Research Toolkit"
readme = "README.md"
authors = [{name = "Riemann Research Project"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mpmath>=1.3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["riemann*"]

[tool.ruff]
line-length = 100
target-version = "py310"